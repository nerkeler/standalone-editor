name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Detect Chrome on the runner
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::Google Chrome was not found on the ubuntu-24.04 runner."
            exit 1
          fi
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:production-smoke
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
        env:
          EDITOR_REPAIR_SCREENSHOT_DIR: ${{ runner.temp }}/editor-repair-screenshots
          EDITOR_REVIEW_DIR: ${{ runner.temp }}/editor-review-screenshots
          EDITOR_REVIEW_INTERACTION_DIR: ${{ runner.temp }}/editor-review-interaction-screenshots
          WORKSPACE_PICKER_EVIDENCE_DIR: ${{ runner.temp }}/workspace-picker-screenshots
      - name: Upload frontend browser screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-screenshots
          path: |
            ${{ runner.temp }}/editor-repair-screenshots
            ${{ runner.temp }}/editor-review-screenshots
            ${{ runner.temp }}/editor-review-interaction-screenshots
            ${{ runner.temp }}/workspace-picker-screenshots
          if-no-files-found: ignore
          retention-days: 14
